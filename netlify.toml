[build]
  command   = "curl -fsSL -o papers.json https://github.com/JavierAldea78/paper-monitor/releases/download/data-latest/papers.json && mkdir -p _site && cp index.html papers_readable.txt _headers _site/ && python3 scripts/build_site.py && HASH=$(git rev-parse --short HEAD) && sed -i \"s/__BUILD_HASH__/${HASH}/g\" _site/index.html"
  publish   = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
