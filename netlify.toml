[build]
  command   = "mkdir -p _site && cp index.html papers.csv _headers _site/ && python3 -c \"import json; data=json.load(open('papers.json')); json.dump([p for p in data if (p.get('score') or 0)>=40], open('_site/papers.json','w'))\" && HASH=$(git rev-parse --short HEAD) && sed -i \"s/__BUILD_HASH__/${HASH}/g\" _site/index.html"
  publish   = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
