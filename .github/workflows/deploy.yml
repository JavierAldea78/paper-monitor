name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages:    write
      id-token: write
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download papers.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view data-latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release download data-latest \
              --pattern 'papers.json' \
              --clobber \
              --repo ${{ github.repository }}
            echo "Downloaded papers.json ($(du -sh papers.json | cut -f1))"
          else
            echo "No release found — skipping" && exit 0
          fi

      - name: Build _site
        run: |
          mkdir -p _site
          cp index.html papers_readable.txt _headers _site/
          python3 scripts/build_site.py
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/__BUILD_HASH__/${HASH}/g" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
