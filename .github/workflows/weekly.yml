name: Weekly Paper Monitor

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: paper-monitor-fetch
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  fetch:
    name: Fetch papers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      count: ${{ steps.count.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download papers.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view data-latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release download data-latest \
              --pattern 'papers.json' \
              --clobber \
              --repo ${{ github.repository }}
            echo "Downloaded papers.json ($(du -sh papers.json | cut -f1))"
          else
            echo 'No existing release — starting fresh'
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch papers from all sources
        env:
          NCBI_API_KEY:   ${{ secrets.NCBI_API_KEY }}
          S2_API_KEY:     ${{ secrets.S2_API_KEY }}
          LENS_TOKEN:     ${{ secrets.LENS_TOKEN }}
        run: python scripts/fetch_papers.py

      - name: Count results
        id: count
        run: |
          echo "count=$(python -c "import json; d=json.load(open('papers.json')); print(len(d))")" \
            >> "$GITHUB_OUTPUT"

      - name: Upload data files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view data-latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload data-latest papers.json papers.csv --clobber \
              --repo ${{ github.repository }}
          else
            gh release create data-latest papers.json papers.csv \
              --title "Paper data — $(date -u +%Y-%m-%d)" \
              --notes "Auto-updated paper database" \
              --repo ${{ github.repository }}
          fi

      - name: Commit readable file
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add papers_readable.txt
          git diff --staged --quiet && echo 'No changes.' && exit 0
          git commit -m "chore: papers $(date -u +%Y-%m-%d) — ${{ steps.count.outputs.count }} papers"
          git pull --rebase origin main
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: fetch
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    permissions:
      contents: read
      pages:    write
      id-token: write
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download papers.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-latest \
            --pattern 'papers.json' \
            --clobber \
            --repo ${{ github.repository }}

      - name: Build _site
        run: |
          mkdir -p _site
          cp index.html papers_readable.txt _headers _site/
          python3 scripts/build_site.py
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/__BUILD_HASH__/${HASH}/g" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────────────────────
  newsletter:
    name: Send newsletter
    needs: [fetch, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: false  # enable once GMAIL_USER / GMAIL_APP_PASSWORD / NEWSLETTER_TO secrets are set

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download papers.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-latest \
            --pattern 'papers.json' \
            --clobber \
            --repo ${{ github.repository }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send newsletter
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO:      ${{ secrets.NEWSLETTER_TO }}
          PAGES_URL:          ${{ needs.deploy.outputs.page_url || '' }}
        run: python scripts/send_newsletter.py
